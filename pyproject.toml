[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-risk-analysis"
version = "0.1.0"
description = "Offline, read-only analysis helpers for the VIRTUAL risk decision system"
requires-python = ">=3.9"
dependencies = ["duckdb==1.3.2", "jsonschema==4.25.1"]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "ruff==0.12.9",
  "types-jsonschema==4.25.1.20251009"
]

[tool.setuptools]
package-dir = {"" = "python/analysis/src"}

[tool.setuptools.packages.find]
where = ["python/analysis/src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["python/analysis/src", "python/analysis/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python/analysis/src", "python/analysis/tests"]

[tool.pytest.ini_options]
testpaths = ["python/analysis/tests"]
addopts = "-q"
